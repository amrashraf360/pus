<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AL_MUSAMIM | المصمم</title>
    <style>
        :root { --gold: #D4AF37; --dark: #1a1a1a; --white: #ffffff; }
        body { background: var(--dark); color: var(--white); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        nav { display: flex; justify-content: space-between; padding: 20px; background: rgba(0,0,0,0.8); position: sticky; top: 0; z-index: 100; }
        .hero { text-align: center; padding: 100px 20px; background: radial-gradient(circle, #333 0%, #1a1a1a 100%); }
        .btn-gold { background: var(--gold); color: #000; padding: 12px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-gold:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--gold); }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 50px; }
        .service-card { background: #222; padding: 30px; border-radius: 15px; border: 1px solid #333; text-align: center; transition: 0.3s; cursor: pointer; }
        .service-card:hover { border-color: var(--gold); }
        .order-form { background: #222; padding: 40px; max-width: 600px; margin: 50px auto; border-radius: 20px; border: 1px solid var(--gold); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; border-radius: 8px; }
        .watermark { position: absolute; bottom: 10px; right: 10px; opacity: 0.3; font-size: 12px; color: var(--gold); }
    </style>
</head>
<body>

<nav>
    <div style="color: var(--gold); font-size: 24px; font-weight: bold;">AL_MUSAMIM</div>
    <div style="font-size: 24px; cursor: pointer;">☰</div>
</nav>

<section class="hero">
    <h1>أحول الأفكار إلى تصاميم <br> <span style="color: var(--gold);">تُعبر عن علامتك التجارية</span></h1>
    <p>مصمم جرافيك محترف | هوية بصرية | UI/UX</p>
    <button class="btn-gold" onclick="document.getElementById('order').scrollIntoView()">اطلب الآن</button>
</section>

<section id="services">
    <h2 style="text-align: center;">خدماتي</h2>
    <div class="services-grid">
        <div class="service-card"><h3>تصميم سوشيال ميديا</h3><p>تصاميم إبداعية لمنشوراتك</p></div>
        <div class="service-card"><h3>هوية بصرية</h3><p>بناء شعار وهوية متكاملة</p></div>
        <div class="service-card"><h3>واجهات مواقع</h3><p>تجربة مستخدم فخمة وعصرية</p></div>
    </div>
</section>

<section id="order" class="order-form">
    <h2 style="text-align: center; color: var(--gold);">نموذج طلب تصميم</h2>
    <input type="text" placeholder="اسم العميل">
    <input type="text" placeholder="اسم البراند">
    <select style="width: 100%; padding: 12px; background: #333; color: white; border-radius: 8px;">
        <option>نوع الطلب</option>
        <option>سوشيال ميديا</option>
        <option>هوية بصرية</option>
    </select>
    <textarea rows="5" placeholder="تفاصيل الطلب..."></textarea>
    <button class="btn-gold" style="width: 100%;">إرسال الطلب</button>
</section>

<footer style="text-align: center; padding: 40px; border-top: 1px solid #333;">
    <p>جميع الحقوق محفوظة © AL_MUSAMIM 2026</p>
</footer>

</body>
</html>
